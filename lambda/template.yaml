AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Resume Matcher Lambda Function with Bedrock Runtime integration

Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock Model ID for resume analysis (e.g., anthropic.claude-3-sonnet-20240229-v1:0)
    Default: anthropic.claude-3-sonnet-20240229-v1:0
    
  AllowedOrigin:
    Type: String
    Description: CORS allowed origin (e.g., https://yourdomain.com or http://localhost:5173)
    Default: http://localhost:5173

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  ResumeMatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-matcher-lambda
      CodeUri: ./
      Handler: src/index.handler
      Description: AI-powered resume matching using AWS Bedrock
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - bedrock-runtime:InvokeModel
            Resource: '*'
        - AWSLambdaBasicExecutionRole
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 86400

Outputs:
  FunctionUrl:
    Description: Lambda Function URL endpoint
    Value: !GetAtt ResumeMatcherFunctionUrl.FunctionUrl
    Export:
      Name: ResumeMatcherFunctionUrl
      
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ResumeMatcherFunction.Arn
    Export:
      Name: ResumeMatcherFunctionArn
