AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Resume Matcher Lambda Function with Bedrock Runtime integration

Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock Model ID for resume analysis
    Default: meta.llama3-8b-instruct-v1:0

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId

Resources:
  ResumeMatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-matcher-lambda
      CodeUri: ./
      Handler: src/index.handler
      Description: AI-powered resume matching using AWS Bedrock
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock-runtime:InvokeModel
              - bedrock-runtime:InvokeModelWithResponseStream
            Resource: 
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/meta.llama3-8b-instruct-v1:0'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
          - Effect: Allow
            Action:
              - aws-marketplace:Subscribe
              - aws-marketplace:ViewSubscriptions
            Resource: '*'
        - AWSLambdaBasicExecutionRole
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - http://localhost:5173
            - https://ashwinkeshwaram.com
            - https://www.ashwinkeshwaram.com
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 86400

Outputs:
  FunctionUrl:
    Description: Lambda Function URL endpoint
    Value: !GetAtt ResumeMatcherFunctionUrl.FunctionUrl
    Export:
      Name: ResumeMatcherFunctionUrl
      
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt ResumeMatcherFunction.Arn
    Export:
      Name: ResumeMatcherFunctionArn
