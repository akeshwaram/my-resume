name: Deploy Lambda to AWS

on:
  push:
    branches:
      - bedrock-agentcore
    paths:
      - 'lambda/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ARTIFACT_BUCKET: resume-matcher-artifacts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda/package-lock.json

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-DeployLambda

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci --omit=dev

      - name: SAM Build
        working-directory: lambda
        run: sam build

      - name: SAM Deploy
        working-directory: lambda
        run: |
          sam deploy \
            --stack-name resume-matcher-stack \
            --region ${{ secrets.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --s3-bucket ${{ env.ARTIFACT_BUCKET }} \
            --parameter-overrides BedrockModelId=amazon.nova-pro-v1:0 \

      - name: Get Function URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name resume-matcher-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FunctionUrl`].OutputValue' \
            --output text
